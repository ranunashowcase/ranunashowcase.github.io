<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranuna Packaging Showcase</title>
    <meta name="description" content="A premium showcase gallery of all Ranuna packaging designs.">
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="ambient-background"></div>
    
    <header class="header">
        <div class="logo-container">
            <img src="All_SKU_PACKAGING_IMAGE/logo ranuna.png" alt="Ranuna Logo" class="logo" onerror="this.style.display='none'">
        </div>
        <h1 class="main-title">Packaging Showcase</h1>
        <p class="subtitle">Our Premium Design Gallery</p>
    </header>

    <div id="back-btn-container" class="back-btn-container" style="display: none;">
        <button id="back-to-categories" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Categories</button>
    </div>

    <main class="gallery-container" id="gallery-container">
        <!-- Categories will be injected here by JS -->
    </main>

    <!-- Lightbox Overlay -->
    <div id="lightbox" class="lightbox">
        <div class="lightbox-header">
            <div class="lightbox-title" id="lightbox-caption">Product Name</div>
            <button class="close-btn" id="close-lightbox" title="Close (Esc)">&times;</button>
        </div>
        <div class="lightbox-body">
            <div class="lightbox-image-container">
                <img class="lightbox-content" id="lightbox-img" alt="Fullscreen Product Image">
            </div>
            <div class="lightbox-controls">
                <button id="zoom-out" title="Zoom Out"><i class="fas fa-minus"></i></button>
                <div class="zoom-level" id="zoom-level">100%</div>
                <button id="zoom-in" title="Zoom In"><i class="fas fa-plus"></i></button>
                <button id="zoom-reset" title="Reset Zoom"><i class="fas fa-expand"></i></button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
